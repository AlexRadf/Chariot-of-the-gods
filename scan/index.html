<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#040906">
<title>CREW CARD SCANNER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CREW CARD SCANNER — Chariot of the Gods.
   Uses the device camera + a self-hosted QR decoder (jsQR) to
   read a crew access-card QR and open the terminal as that
   crew member. Falls back to manual card-ID entry.
   ============================================================ */
:root{
  --phos:#8affb0; --dim:#3d7a53; --faint:#1d3b2a;
  --crt:#040906; --raise:#081209; --amber:#f0b23e; --alert:#ff5c47; --white:#e9fff2;
  --glow:0 0 6px rgba(138,255,176,.45);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; touch-action:manipulation; }
body{
  background:var(--crt); color:var(--phos);
  font-family:'Share Tech Mono',ui-monospace,monospace; text-shadow:var(--glow);
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
a{ color:var(--amber); text-decoration:none; }
button{ font-family:inherit; background:none; border:1px solid var(--faint); color:var(--phos);
  text-shadow:var(--glow); font-size:14px; padding:.6em 1.1em; cursor:pointer; text-transform:uppercase; letter-spacing:.08em; }
button:hover{ background:var(--faint); }

.wrap{ position:fixed; inset:0; display:flex; flex-direction:column; }
.bar{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom:2px solid var(--faint); z-index:20; }
.bar .id{ font-family:'VT323',monospace; font-size:26px; letter-spacing:.05em; }
.bar .id small{ display:block; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--dim); letter-spacing:.14em; }
.bar a{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }

.stage{ flex:1; position:relative; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#000; }
#video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
canvas{ display:none; }

/* viewfinder */
.finder{ position:relative; z-index:10; width:min(70vw,60vh); aspect-ratio:1; pointer-events:none; }
.finder .c{ position:absolute; width:28px; height:28px; border:2px solid var(--phos); box-shadow:0 0 8px rgba(138,255,176,.4); }
.finder .tl{ top:0; left:0; border-right:0; border-bottom:0; }
.finder .tr{ top:0; right:0; border-left:0; border-bottom:0; }
.finder .bl{ bottom:0; left:0; border-right:0; border-top:0; }
.finder .br{ bottom:0; right:0; border-left:0; border-top:0; }
.finder .scan{ position:absolute; left:6px; right:6px; height:2px; background:var(--phos);
  box-shadow:0 0 10px var(--phos); animation:sweep 2.2s ease-in-out infinite; }
@keyframes sweep{ 0%,100%{ top:6px } 50%{ top:calc(100% - 8px) } }
.finder.ok .c{ border-color:var(--amber); box-shadow:0 0 10px var(--amber); }
.finder.ok .scan{ display:none; }

.hint{ position:absolute; bottom:0; left:0; right:0; z-index:10; text-align:center; padding:14px;
  font-size:12px; color:var(--dim); letter-spacing:.08em; background:linear-gradient(transparent, rgba(4,9,6,.85)); }
.hint b{ color:var(--phos); }

/* overlays: start / result / manual / error */
.panel{ position:absolute; inset:0; z-index:25; display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; text-align:center; padding:26px; background:rgba(4,9,6,.94); }
.panel.on{ display:flex; }
.panel .big{ font-family:'VT323',monospace; font-size:clamp(34px,10vw,60px); letter-spacing:.05em; }
.panel .sub{ color:var(--dim); font-size:13px; letter-spacing:.14em; text-transform:uppercase; max-width:30ch; line-height:1.6; }
.panel .blink{ color:var(--amber); animation:bl 1.1s steps(1) infinite; letter-spacing:.2em; }
@keyframes bl{ 50%{opacity:0} }
.panel .found{ font-family:'VT323',monospace; font-size:clamp(28px,8vw,48px); color:var(--white); word-break:break-all; }
.panel .row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.panel .row button.go{ border-color:var(--phos); color:var(--white); }
.manual input{ background:var(--crt); border:1px solid var(--faint); color:var(--phos); font-family:inherit;
  font-size:22px; padding:.4em .6em; width:6em; text-align:center; letter-spacing:.2em; }
.manual input:focus{ outline:1px solid var(--amber); }
.err{ color:var(--alert); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="id">◫ SCAN CARD<small>USCSS · ACCESS TERMINAL</small></span>
    <span><a href="../sheet/">◄ Crew sheets</a></span>
  </div>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <div class="finder" id="finder">
      <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
      <span class="scan"></span>
    </div>
    <div class="hint" id="hint">Point the camera at a crew card's <b>QR code</b></div>

    <!-- start -->
    <div class="panel on" id="startP">
      <div class="big">◫ SCAN CARD</div>
      <div class="sub">Scan a crew access card to log in to the terminal as that crew member.</div>
      <div class="blink">▶ TAP TO START CAMERA</div>
      <button id="manualBtn2" style="border-color:var(--dim)">Enter ID instead</button>
    </div>

    <!-- result -->
    <div class="panel" id="resultP">
      <div class="sub">Card read</div>
      <div class="found" id="foundTxt">—</div>
      <div class="row">
        <button class="go" id="openBtn">Open ▸</button>
        <button id="againBtn">Scan again</button>
      </div>
    </div>

    <!-- manual -->
    <div class="panel manual" id="manualP">
      <div class="sub">Enter the 4-digit card ID</div>
      <input id="idIn" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
      <div class="row">
        <button class="go" id="idGo">Open ▸</button>
        <button id="idCancel">Back to camera</button>
      </div>
      <div class="sub err" id="manualErr"></div>
    </div>

    <!-- error -->
    <div class="panel" id="errP">
      <div class="big err">NO CAMERA</div>
      <div class="sub" id="errMsg">Camera unavailable or permission denied.</div>
      <div class="row"><button id="errManual">Enter ID instead</button><button id="errRetry">Retry camera</button></div>
    </div>
  </div>
</div>

<script src="../assets/jsqr.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const video = $("#video");
const canvas = document.createElement("canvas");
const cx = canvas.getContext("2d", { willReadFrequently:true });
let stream=null, raf=null, scanning=false;

function show(id){ ["startP","resultP","manualP","errP"].forEach(p=> $("#"+p).classList.toggle("on", p===id)); }
function hideAll(){ ["startP","resultP","manualP","errP"].forEach(p=> $("#"+p).classList.remove("on")); }

async function startCamera(){
  stopCamera();
  hideAll();
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" } }, audio:false });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    $("#finder").classList.remove("ok");
    loop();
  }catch(e){
    $("#errMsg").textContent = (e && e.name==="NotAllowedError")
      ? "Camera permission was denied. Allow camera access, or enter the card ID by hand."
      : "Camera unavailable on this device. Enter the card ID by hand.";
    show("errP");
  }
}
function stopCamera(){
  scanning=false;
  if(raf) cancelAnimationFrame(raf), raf=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
}
function loop(){
  if(!scanning) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    const w=video.videoWidth, h=video.videoHeight;
    if(w && h){
      canvas.width=w; canvas.height=h;
      cx.drawImage(video,0,0,w,h);
      let img; try{ img = cx.getImageData(0,0,w,h); }catch(e){ img=null; }
      if(img && typeof jsQR==="function"){
        const code = jsQR(img.data, w, h, { inversionAttempts:"dontInvert" });
        if(code && code.data){ onDecoded(code.data); return; }
      }
    }
  }
  raf = requestAnimationFrame(loop);
}

function onDecoded(text){
  scanning=false;
  $("#finder").classList.add("ok");
  if(navigator.vibrate){ try{ navigator.vibrate(30); }catch(e){} }
  const target = resolveTarget(text);
  $("#foundTxt").textContent = target.label;
  $("#openBtn").onclick = ()=> go(target.url);
  show("resultP");
  // brief auto-open for a smooth "scan → terminal" flow
  clearTimeout(onDecoded._t);
  onDecoded._t = setTimeout(()=>{ if($("#resultP").classList.contains("on")) go(target.url); }, 1400);
}

/* Turn decoded text into a destination. Crew cards encode the full terminal
   URL with ?id=NNNN; a bare 4-digit code maps to ../?id=NNNN. */
function resolveTarget(text){
  text = (text||"").trim();
  const idFromUrl = text.match(/[?&]id=(\d{3,5})\b/);
  if(idFromUrl) return { url:text, label:"ID "+idFromUrl[1] };
  if(/^\d{3,5}$/.test(text)) return { url:"../?id="+text, label:"ID "+text };
  if(/^https?:\/\//i.test(text)) return { url:text, label:text };
  return { url:null, label:text };
}
function go(url){
  stopCamera();
  if(!url){ $("#hint").innerHTML = '<b class="err">Unrecognised code.</b> Scan a crew card.'; startCamera(); return; }
  location.href = url;
}

/* ---- controls ---- */
$("#startP").addEventListener("click", e=>{ if(e.target.id==="manualBtn2") return; startCamera(); });
$("#manualBtn2").addEventListener("click", ()=>{ stopCamera(); openManual(); });
$("#againBtn").addEventListener("click", startCamera);
$("#errRetry").addEventListener("click", startCamera);
$("#errManual").addEventListener("click", openManual);
$("#idCancel").addEventListener("click", startCamera);

function openManual(){ show("manualP"); setTimeout(()=>$("#idIn").focus(),50); }
function submitId(){
  const v = ($("#idIn").value||"").trim();
  if(!/^\d{3,5}$/.test(v)){ $("#manualErr").textContent="Enter a 3–5 digit card ID."; return; }
  go("../?id="+v);
}
$("#idGo").addEventListener("click", submitId);
$("#idIn").addEventListener("keydown", e=>{ if(e.key==="Enter") submitId(); });

addEventListener("pagehide", stopCamera);
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("../sw.js").catch(function(){});});}</script>
</body>
</html>

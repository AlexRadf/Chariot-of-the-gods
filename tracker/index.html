<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#040906">
<title>M314 MOTION TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
/* ============================================================
   M314 MOTION TRACKER — mobile prop for ALIEN RPG
   Chariot of the Gods. Sweeping scope, approaching contacts,
   synthesized proximity ping. GM tool: tap the scope to place
   a contact where you want the players to think something is.
   ============================================================ */
:root{
  --phos:#8affb0; --dim:#3d7a53; --faint:#1d3b2a;
  --crt:#040906; --raise:#081209;
  --amber:#f0b23e; --alert:#ff5c47;
  --glow:0 0 6px rgba(138,255,176,.5);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  background:var(--crt); color:var(--phos);
  font-family:'Share Tech Mono',ui-monospace,monospace; text-shadow:var(--glow);
  user-select:none; -webkit-user-select:none; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:80; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,.7) 100%);
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001s!important} }

#start{
  position:fixed; inset:0; z-index:90; background:var(--crt); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; text-align:center; padding:24px;
}
#start .big{ font-family:'VT323',monospace; font-size:clamp(46px,15vw,90px); letter-spacing:.05em; }
#start .sub{ color:var(--dim); font-size:clamp(12px,3.4vw,16px); letter-spacing:.16em; }
#start .blink{ color:var(--amber); animation:bl 1.1s steps(1) infinite; letter-spacing:.2em; margin-top:8px; }
#start .hint{ color:var(--faint); font-size:11px; letter-spacing:.1em; max-width:30ch; line-height:1.5; margin-top:14px; }
@keyframes bl{50%{opacity:0}}

#app{ display:none; height:100dvh; flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)); }
#app.on{ display:flex; }

.hud{ display:flex; justify-content:space-between; align-items:baseline; padding:2px 4px 8px;
  border-bottom:2px solid var(--faint); }
.hud .id{ font-family:'VT323',monospace; font-size:28px; letter-spacing:.05em; }
.hud .st{ font-size:12px; color:var(--dim); letter-spacing:.14em; text-transform:uppercase; }
.hud .st.alert{ color:var(--alert); }

.scopewrap{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
#scope{ width:100%; height:100%; display:block; touch-action:none; }
.range{ position:absolute; top:8px; left:10px; font-size:12px; color:var(--dim); letter-spacing:.1em; }
.reading{ position:absolute; bottom:10px; left:0; right:0; text-align:center; pointer-events:none; }
.reading .d{ font-family:'VT323',monospace; font-size:clamp(40px,13vw,72px); line-height:1; color:var(--amber); }
.reading .d.close{ color:var(--alert); animation:bl .5s steps(1) infinite; }
.reading .l{ font-size:12px; color:var(--dim); letter-spacing:.24em; text-transform:uppercase; margin-top:2px; }
.reading .l.alert{ color:var(--alert); }

.controls{ display:flex; gap:8px; padding-top:8px; }
.controls button{ flex:1; background:none; border:1px solid var(--faint); color:var(--phos);
  font-family:inherit; text-shadow:var(--glow); font-size:12px; letter-spacing:.08em;
  padding:.7em .2em; text-transform:uppercase; cursor:pointer; }
.controls button:active{ background:var(--faint); }
.controls button.on{ background:var(--faint); color:var(--amber); border-color:var(--amber); }
.tip{ text-align:center; font-size:10px; color:var(--faint); letter-spacing:.1em;
  padding-top:6px; text-transform:uppercase; }
.tip a{ color:var(--faint); text-decoration:none; }

/* live dice feed — rolls from player sheets, for the GM */
#rollfeed{ position:absolute; top:calc(6px + env(safe-area-inset-top)); left:8px; right:8px; z-index:70;
  display:flex; flex-direction:column; gap:4px; pointer-events:none; }
#rollfeed .rl{ border:1px solid var(--faint); background:rgba(6,15,10,.92); padding:5px 8px;
  font-size:11.5px; line-height:1.35; animation:rin .3s ease; }
#rollfeed .rl.panic{ border-color:var(--alert); }
#rollfeed .rl .who{ color:var(--amber); text-transform:uppercase; letter-spacing:.05em; }
#rollfeed .rl .s{ font-family:'VT323',monospace; font-size:15px; color:var(--phos); }
#rollfeed .rl.panic .s{ color:var(--alert); }
#rollfeed .rl .dim{ color:var(--dim); }
@keyframes rin{ from{ transform:translateY(-8px); opacity:0 } to{ transform:none; opacity:1 } }
</style>
</head>
<body>

<div id="start">
  <div class="big">M314</div>
  <div class="sub">MOTION TRACKER · WEYLAND-YUTANI</div>
  <div class="blink">▶ TAP TO ACTIVATE</div>
  <div class="hint">GM prop. Tap the scope to place a contact where you want one. Contacts drift inward as they close on the crew.</div>
</div>

<div id="app">
  <div class="hud">
    <span class="id">M314</span>
    <span class="st" id="st">SCANNING</span>
  </div>
  <div class="scopewrap">
    <div id="rollfeed" aria-hidden="true"></div>
    <canvas id="scope"></canvas>
    <div class="range" id="rangelab">RANGE 20 M</div>
    <div class="reading">
      <div class="d" id="dist">--</div>
      <div class="l" id="distlab">NO CONTACT</div>
    </div>
  </div>
  <div class="controls">
    <button id="bAdd">＋ Contact</button>
    <button id="bAuto">Auto</button>
    <button id="bSound" class="on">Sound</button>
    <button id="bClear">Clear</button>
  </div>
  <div class="tip">Tap scope to place · <a href="../sheet/">Crew sheets ◆</a> · <a href="../display/">Main display ▲</a> · <a href="../">Terminal ◄</a></div>
</div>

<script src="../assets/rollbus.js"></script>
<script>
const $ = s => document.querySelector(s);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MAX_M = 20;              // scope radius in metres
let soundOn = true, auto = false;

/* -------------------- audio -------------------- */
let AC=null;
function audioInit(){
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }
}
/* the classic tracker ping: quick two-stage blip */
function ping(prox){ // prox 0(far)..1(close)
  if(!AC || !soundOn) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  lp.type="lowpass"; lp.frequency.value = 2600;
  const base = 900 + prox*520;
  o.type = "square"; o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base*0.7, t+0.05);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.16 + prox*0.12, t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
  o.connect(lp); lp.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+0.11);
}
/* faint sweep tick */
function sweepTick(){
  if(!AC || !soundOn) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.value=320;
  g.gain.setValueAtTime(0.03,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.06);
}

/* -------------------- state -------------------- */
// contacts: polar — a = bearing (rad), r = metres from centre, spd = closing speed m/s
let contacts = [];
function addContact(a, r, spd){
  contacts.push({ a, r, spd: spd!=null?spd : (0.25+Math.random()*0.5), flare:0, jitter:Math.random()*6.28 });
}
function randContact(){ addContact(Math.random()*Math.PI*2, MAX_M*(0.7+Math.random()*0.28)); }

/* -------------------- canvas -------------------- */
const cv = $("#scope"), cx2 = cv.getContext("2d");
let CW,CH,CXc,CYc,RAD,DPR=window.devicePixelRatio||1;
function fit(){
  const b = cv.parentElement.getBoundingClientRect();
  CW = Math.floor(b.width*DPR); CH = Math.floor(b.height*DPR);
  cv.width=CW; cv.height=CH; cv.style.width=b.width+"px"; cv.style.height=b.height+"px";
  CXc=CW/2; CYc=CH/2; RAD=Math.min(CW,CH)/2 - 6*DPR;
}
addEventListener("resize", fit);

let sweep = -Math.PI/2, lastSweep=sweep;
function m2px(r){ return (r/MAX_M)*RAD; }

function draw(dt){
  cx2.clearRect(0,0,CW,CH);
  // rings + labels
  cx2.strokeStyle="rgba(138,255,176,.16)"; cx2.lineWidth=1*DPR;
  cx2.fillStyle="rgba(138,255,176,.28)";
  cx2.font=(10*DPR)+"px 'Share Tech Mono',monospace"; cx2.textAlign="left";
  for(let i=1;i<=4;i++){
    const rr=RAD*i/4; cx2.beginPath(); cx2.arc(CXc,CYc,rr,0,Math.PI*2); cx2.stroke();
    cx2.fillText((MAX_M*i/4)+"m", CXc+3*DPR, CYc-rr+12*DPR);
  }
  // crosshair
  cx2.beginPath(); cx2.moveTo(CXc-RAD,CYc); cx2.lineTo(CXc+RAD,CYc);
  cx2.moveTo(CXc,CYc-RAD); cx2.lineTo(CXc,CYc+RAD); cx2.stroke();
  // operator marker
  cx2.fillStyle="rgba(138,255,176,.7)";
  cx2.beginPath(); cx2.moveTo(CXc,CYc-6*DPR); cx2.lineTo(CXc-5*DPR,CYc+4*DPR); cx2.lineTo(CXc+5*DPR,CYc+4*DPR); cx2.closePath(); cx2.fill();

  // sweep
  if(!reduced) sweep += dt*1.6;
  if(sweep>Math.PI*2) sweep-=Math.PI*2;
  if(cx2.createConicGradient){
    const g=cx2.createConicGradient(sweep,CXc,CYc);
    g.addColorStop(0,"rgba(138,255,176,.32)"); g.addColorStop(0.08,"rgba(138,255,176,0)");
    g.addColorStop(1,"rgba(138,255,176,0)");
    cx2.fillStyle=g; cx2.beginPath(); cx2.arc(CXc,CYc,RAD,0,Math.PI*2); cx2.fill();
  }
  cx2.strokeStyle="rgba(138,255,176,.55)"; cx2.lineWidth=2*DPR; cx2.beginPath();
  cx2.moveTo(CXc,CYc); cx2.lineTo(CXc+Math.cos(sweep)*RAD, CYc+Math.sin(sweep)*RAD); cx2.stroke();

  // update + draw contacts
  let nearest=null;
  contacts.forEach(c=>{
    c.r -= c.spd*dt;                       // close on the operator
    if(c.r < 0.4) c.r = 0.4;
    // wobble so blips feel alive
    c.jitter += dt*2; const ja = c.a + Math.sin(c.jitter)*0.02;
    // sweep passes contact?
    const norm = a=>((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const s0=norm(lastSweep), s1=norm(sweep), ca=norm(ja);
    let crossed = s0<=s1 ? (ca>s0 && ca<=s1) : (ca>s0 || ca<=s1);
    if(crossed){ c.flare=1; }
    c.flare = Math.max(0, c.flare - dt*1.1);
    if(!nearest || c.r<nearest.r) nearest=c;
    const px=CXc+Math.cos(ja)*m2px(c.r), py=CYc+Math.sin(ja)*m2px(c.r);
    const close = c.r < 3;
    cx2.shadowColor = close?"rgba(255,92,71,.9)":"rgba(240,178,62,.85)";
    cx2.shadowBlur = (4+c.flare*12)*DPR;
    cx2.fillStyle = close ? "rgba(255,92,71,"+(0.5+c.flare*0.5)+")"
                          : "rgba(240,178,62,"+(0.4+c.flare*0.6)+")";
    cx2.beginPath(); cx2.arc(px,py,(4+c.flare*3)*DPR,0,Math.PI*2); cx2.fill();
    cx2.shadowBlur=0;
  });
  lastSweep = sweep;
  updateReading(nearest);
}

/* -------------------- readouts + ping cadence -------------------- */
let stEl=$("#st"), distEl=$("#dist"), distLab=$("#distlab");
function updateReading(n){
  if(!n){
    distEl.textContent="--"; distEl.className="d";
    distLab.textContent="NO CONTACT"; distLab.className="l";
    stEl.textContent="SCANNING"; stEl.className="st";
    return;
  }
  const m = n.r.toFixed(1);
  const close = n.r<3;
  distEl.textContent = m; distEl.className = "d"+(close?" close":"");
  distLab.textContent = "METRES · "+contacts.length+" CONTACT"+(contacts.length>1?"S":"");
  distLab.className = "l"+(close?" alert":"");
  stEl.textContent = close ? "◄ CONTACT ►" : "MOVEMENT DETECTED";
  stEl.className = "st"+(close?" alert":"");
}

// proximity ping: interval shrinks as nearest contact closes (the classic accel beep)
let pingTimer=null;
function schedulePing(){
  clearTimeout(pingTimer);
  let interval=1500, prox=0;
  if(contacts.length){
    let n=contacts.reduce((a,c)=>c.r<a.r?c:a);
    prox = 1 - Math.min(1, n.r/MAX_M);
    interval = 1400 - prox*1180;           // 1400ms far -> ~220ms close
  }
  pingTimer = setTimeout(()=>{
    if(contacts.length){
      ping(prox);
      if(prox>0.75 && navigator.vibrate) { try{navigator.vibrate(20);}catch(e){} }
    }
    schedulePing();
  }, interval);
}

/* -------------------- input -------------------- */
cv.addEventListener("pointerdown", e=>{
  const b=cv.getBoundingClientRect();
  const x=(e.clientX-b.left)*DPR-CXc, y=(e.clientY-b.top)*DPR-CYc;
  const r=Math.min(MAX_M, Math.hypot(x,y)/RAD*MAX_M);
  const a=Math.atan2(y,x);
  addContact(a, Math.max(2,r));
  sweepTick();
});
$("#bAdd").addEventListener("click", randContact);
$("#bClear").addEventListener("click", ()=>{ contacts=[]; });
$("#bSound").addEventListener("click", e=>{
  soundOn=!soundOn; e.currentTarget.classList.toggle("on",soundOn);
  if(soundOn && AC && AC.state==="suspended") AC.resume();
});
let autoTimer=null;
$("#bAuto").addEventListener("click", e=>{
  auto=!auto; e.currentTarget.classList.toggle("on",auto);
  clearInterval(autoTimer);
  if(auto){ autoTimer=setInterval(()=>{ if(contacts.length<5) randContact(); }, 3500); }
});

/* -------------------- loop / boot -------------------- */
let last=0;
function frame(t){ const dt=Math.min(0.05,(t-last)/1000||0); last=t; draw(dt); requestAnimationFrame(frame); }
function boot(){
  audioInit(); if(AC && AC.state==="suspended") AC.resume();
  $("#start").style.display="none"; $("#app").classList.add("on");
  fit(); requestAnimationFrame(frame); schedulePing();
  // start with one distant contact so there's something to see
  addContact(-Math.PI/2 + 0.4, MAX_M*0.9, 0.35);
  try{ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }catch(e){}
}
$("#start").addEventListener("click", boot);

/* -------------------- live crew dice feed (GM) -------------------- */
(function(){
  const box = $("#rollfeed"); const MAX = 3;
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
  function add(o){
    const el=document.createElement("div");
    el.className="rl"+(o.kind==="panic"?" panic":"");
    if(o.kind==="panic"){
      el.innerHTML='<span class="who">'+esc(o.who)+'</span> PANIC <span class="s">'+o.panicTotal+'</span> <span class="dim">'+esc(o.panicText||"")+'</span>';
    } else {
      el.innerHTML='<span class="who">'+esc(o.who)+'</span> '+(o.kind==="push"?"push":"roll")+' <span class="dim">'+esc(o.label)+'</span> → <span class="s">'+o.successes+'</span><span class="dim"> succ'+(o.pushed?(" p×"+o.pushed):"")+(o.stressOnes?(" ✦"+o.stressOnes):"")+'</span>';
    }
    box.appendChild(el);
    while(box.children.length>MAX) box.removeChild(box.firstChild);
    clearTimeout(el._t); el._t = setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 12000);
  }
  RollBus.config({});
  RollBus.on("roll", add);
})();
</script>
</body>
</html>
